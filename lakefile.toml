name = "DgCat"
defaultTargets = ["DgCat"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/farmanb/mathlib4.git"
rev = "dgcat"  # integration branch of the PI's fork; PR branches merge here

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"
rev = "master"

[[lean_lib]]
name = "DgCat"
